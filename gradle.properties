android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false
# The default 512MB daemon heap runs out in :app:compressReleaseAssets (rootfs.tzst alone is
# ~64MB) while R8 runs beside it - the release CI failed on its first attempt every time.
# GitHub's ubuntu-latest runner has 16GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
